# docker compose up       -> sobe banco, API e frontend (http://localhost:5173)
# docker compose up -d db -> sobe só o banco, para rodar API e frontend localmente
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: puc_challenge
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: P@yment2022
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d puc_challenge"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/puc_challenge
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080 # Serviço "api" deste arquivo, acessado pela rede interna do compose
    ports:
      - "5173:80"
    depends_on:
      - api
